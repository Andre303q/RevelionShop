<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revelion Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NOTIFICACIÓN FLOTANTE (TOAST) -->
  <div id="toast-notification" class="toast">¡Producto añadido al carrito!</div>

  <!-- HEADER FIJO -->
  <header class="header">
    <div class="logo-container">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      </div>
      <div class="logo-text">
        <span class="logo-title">REVELION</span>
        <span class="logo-subtitle">SHOP</span>
      </div>
    </div>

    <div class="nav-actions">
      <span id="user-display" style="display: none;"></span>
      <button id="btn-login-modal" class="btn secondary">Iniciar Sesión</button>
      <button id="btn-logout" class="btn danger" style="display: none;">Salir</button>
      <button id="btn-cart-toggle" class="btn primary">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE CATÁLOGOS SEPARADOS -->
  <main class="catalogue-wrapper">
    <h1 class="main-title">Catálogo Exclusivo</h1>

    <!-- SECCIÓN 1: ROPA -->
    <section class="category-section">
      <h2 class="category-title">👕 Ropa y Textil</h2>
      <div id="grid-ropa" class="products-grid"></div>
    </section>

    <!-- SECCIÓN 2: ACCESORIOS -->
    <section class="category-section">
      <h2 class="category-title">⌚ Accesorios y Relojes</h2>
      <div id="grid-reloj" class="products-grid"></div>
    </section>

    <!-- SECCIÓN 3: COLECCIONABLES -->
    <section class="category-section">
      <h2 class="category-title">🎮 Coleccionables y Juguetes</h2>
      <div id="grid-coleccionable" class="products-grid"></div>
    </section>
  </main>

  <!-- MODAL DE CARRITO -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="close-cart">&times;</button>
      <h2 class="modal-title">Tu Carrito de Compras</h2>
      <div id="cart-items-list" class="cart-items-list"></div>
      <div class="cart-summary">
        <span>Total:</span>
        <span id="cart-total">Q 0.00</span>
      </div>
      <button id="btn-checkout" class="btn primary" style="width: 100%;">Realizar Compra</button>
    </div>
  </div>

  <!-- MODAL DE INICIO DE SESIÓN / REGISTRO -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="close-login">&times;</button>
      <h2 class="modal-title" id="modal-title-auth">Iniciar Sesión</h2>
      
      <form id="form-auth">
        <div class="form-group" id="group-name" style="display: none;">
          <label>Nombre Completo</label>
          <input type="text" id="auth-name" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Nombre de Usuario</label>
          <input type="text" id="auth-user" required placeholder="Ej. juan123">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="auth-pass" required placeholder="••••••••">
        </div>
        <div id="auth-error" class="auth-error-msg" style="display: none;"></div>
        <button type="submit" id="auth-submit-btn" class="btn primary" style="width: 100%; margin-top: 0.5rem;">Entrar</button>
      </form>

      <div class="auth-switch">
        <a href="#" id="sw-mode-text">¿No tienes cuenta? Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
