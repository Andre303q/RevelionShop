<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revelion Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER Y NAVEGACIÓN -->
    <header>
        <div class="logo">⚡ Revelion Shop</div>
        <nav id="user-nav">
            <!-- Saludo al usuario logueado -->
            <span id="user-display" style="display:none; color: var(--accent); font-weight: 600; margin-right: 15px;"></span>
            
            <button id="btn-login-modal" class="btn">Iniciar Sesión</button>
            <button id="btn-logout" class="btn secondary" style="display:none;">Cerrar Sesión</button>
            <button id="btn-cart-toggle" class="btn">🛒 Carrito (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main class="container">
        <!-- SECCIÓN DE PRODUCTOS -->
        <section id="shop-section">
            <h2>Catálogo de Productos</h2>
            <div id="products-container" class="grid">
                <!-- Los productos se cargan dinámicamente desde JavaScript -->
            </div>
        </section>
    </main>

    <!-- MODAL DE CARRITO -->
    <div id="cart-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-cart" class="close">&times;</span>
            <h2>Tu Carrito de Compras</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>Total: Q <span id="cart-total-price">0.00</span></h3>
                <button id="btn-checkout" class="btn primary">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="auth-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-auth" class="close">&times;</span>
            <h2 id="auth-title">Iniciar Sesión</h2>
            <form id="auth-form">
                <!-- Campo de Nombre de Usuario (Solo visible al registrarse) -->
                <div id="username-field-container" style="display: none; margin-bottom: 1rem;">
                    <input type="text" id="auth-username" placeholder="Nombre de usuario" style="width: 100%; padding: 0.5rem; background: var(--bg-dark); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <input type="text" id="auth-user-input" placeholder="Correo o Nombre de usuario" required style="width: 100%; padding: 0.5rem; background: var(--bg-dark); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <input type="password" id="auth-password" placeholder="Contraseña" required style="width: 100%; padding: 0.5rem; background: var(--bg-dark); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;">
                </div>
                <button type="submit" id="auth-submit-btn" class="btn primary" style="width: 100%;">Entrar</button>
            </form>
            <p id="auth-toggle-text" style="margin-top: 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="#" id="toggle-mode" style="color: var(--accent);">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script src="script.js"></script>
</body>
</html>
