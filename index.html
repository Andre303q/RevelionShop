<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revelion Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER Y NAVEGACIÓN -->
    <header>
        <div class="logo">⚡ Revelion Shop</div>
        <nav id="user-nav">
            <!-- Se actualiza dinámicamente según la sesión -->
            <span id="user-email" style="display:none;"></span>
            <button id="btn-login-modal" class="btn">Iniciar Sesión</button>
            <button id="btn-logout" class="btn secondary" style="display:none;">Cerrar Sesión</button>
            <button id="btn-cart-toggle" class="btn">🛒 Carrito (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main class="container">
        <!-- SECCIÓN DE PRODUCTOS -->
        <section id="shop-section">
            <h2>Catálogo de Productos</h2>
            <div id="products-container" class="grid">
                <!-- Los productos se cargan desde JavaScript/Firestore -->
            </div>
        </section>

        <!-- SECCIÓN DE HISTORIAL DE COMPRAS (Oculta por defecto si no hay sesión) -->
        <section id="orders-section" style="display:none;">
            <h2>Mis Compras Anteriores</h2>
            <div id="orders-container"></div>
        </section>
    </main>

    <!-- MODAL DE CARRITO -->
    <div id="cart-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-cart" class="close">&times;</span>
            <h2>Tu Carrito de Compras</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>Total: $<span id="cart-total-price">0.00</span></h3>
                <button id="btn-checkout" class="btn primary">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="auth-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-auth" class="close">&times;</span>
            <h2 id="auth-title">Iniciar Sesión</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="Correo electrónico" required>
                <input type="password" id="auth-password" placeholder="Contraseña" required>
                <button type="submit" id="auth-submit-btn" class="btn primary">Entrar</button>
            </form>
            <p id="auth-toggle-text">¿No tienes cuenta? <a href="#" id="toggle-mode">Regístrate aquí</a></p>
        </div>
    </div>

    <!-- SCRIPTS DE FIREBASE Y LÓGICA -->
    <script type="module" src="script.js"></script>
</body>
</html>
