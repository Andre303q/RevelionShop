<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revelion Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER FIJO -->
  <header>
    <a href="#" class="logo-container">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      </div>
      <div class="logo-text">
        <span class="logo-title">REVELION</span>
        <span class="logo-subtitle">Shop</span>
      </div>
    </a>

    <div class="nav-actions">
      <span id="user-display" style="display: none;"></span>
      <button id="btn-login-modal" class="btn secondary">Iniciar Sesión</button>
      <button id="btn-logout" class="btn danger" style="display: none;">Salir</button>
      <button id="btn-cart-toggle" class="btn primary">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <!-- CATÁLOGO DE PRODUCTOS -->
  <main class="catalogue-wrapper">
    <h1 class="section-title">Catálogo de Productos</h1>
    <div id="products-container">
      <!-- Los productos se cargan dinámicamente mediante JS -->
    </div>
  </main>

  <!-- MODAL DE CARRITO -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="close-cart">&times;</button>
      <h2 class="modal-title">Tu Carrito de Compras</h2>
      <div id="cart-items-list" class="cart-items-list">
        <!-- Items del carrito -->
      </div>
      <div class="cart-summary">
        <span>Total:</span>
        <span id="cart-total">Q 0.00</span>
      </div>
      <button class="btn primary" style="width: 100%;">Finalizar Compra</button>
    </div>
  </div>

  <!-- MODAL DE INICIO DE SESIÓN -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="close-login">&times;</button>
      <h2 class="modal-title">Iniciar Sesión</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Correo o Nombre de usuario</label>
          <input type="text" id="login-user" required placeholder="Ej. prueba">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-pass" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 0.5rem;">Entrar</button>
      </form>
      <div class="auth-switch">
        <a href="#" id="sw-to-register">¿No tienes cuenta? Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
